[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quasartrend"
version = "0.1.0"
description = "PineScript-compatible indicator implementations for QuasarTrend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/quasartrend"]

